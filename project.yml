name: HomeserverDashboard

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  HomeserverDashboard:
    type: application
    platform: iOS
    sources:
      - path: HomeserverDashboard
        excludes:
          - "Info.plist"
          - "HomeserverDashboard.entitlements"
      - path: Resources/homeserver-root-ca.pem
        buildPhase: resources
    info:
      path: HomeserverDashboard/Info.plist
      properties:
        CFBundleDisplayName: "Homeserver Dashboard"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "Wird verwendet, um im Alltag-Modus die nächstgelegene Tankstelle (ohne Shell/Aral) zu finden."
        NSLocationTemporaryUsageDescriptionDictionary:
          TankstellenSuche: "Für die Umkreissuche nach Tankstellen wird kurzzeitig eine genaue Standortangabe benötigt — sonst kann eine tatsächlich nahe Tankstelle knapp außerhalb des Suchradius fallen."
    entitlements:
      path: HomeserverDashboard/HomeserverDashboard.entitlements
    postBuildScripts:
      - name: Version aus Git-Tag
        basedOnDependencyAnalysis: false
        script: |
          version=$(git -C "$SRCROOT" describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          if [ -n "$version" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          fi
    settings:
      base:
        PRODUCT_NAME: "Homeserver Dashboard"
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.homeserver-dashboard
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
    scheme:
      testTargets: []
      gatherCoverageData: false

schemes:
  HomeserverDashboard:
    build:
      targets:
        HomeserverDashboard: all
    run:
      config: Debug
    archive:
      config: Release
